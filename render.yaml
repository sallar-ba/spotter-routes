# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: spotter-routes
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
