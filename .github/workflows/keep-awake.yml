name: Keep demo awake

# Render's free plan sleeps after 15 idle minutes. Set the APP_URL repository variable to enable.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --output /dev/null "$APP_URL"
        env:
          APP_URL: ${{ vars.APP_URL }}
